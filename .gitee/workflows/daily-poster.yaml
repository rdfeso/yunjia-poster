name: 云嘉每日资讯海报
on:
  schedule:
    # 北京时间 06:00 = UTC 22:00(前一天)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests playwright beautifulsoup4 lxml

      - name: 安装 Playwright 浏览器
        run: |
          playwright install chromium

      - name: 重建配置文件
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cat > config.json << 'CONFEOF'
          {
            "domestic_count": 10,
            "international_count": 6,
            "feishu": {
              "app_id": "$FEISHU_APP_ID",
              "app_secret": "$FEISHU_APP_SECRET",
              "chat_id": "$FEISHU_CHAT_ID"
            },
            "brand": {
              "name": "北京云嘉律师事务所",
              "subtitle": "云起龙骧 至道嘉猷",
              "logo": "assets/yunjia-logo.png",
              "header_image": "assets/yunbao-header-v1.png",
              "qr_code": "assets/wechat-qr.jpg",
              "contact_label": "扫码关注 · 获取更多资讯"
            },
            "recruitment": "长期诚聘独立律师、派驻律师、专利代理师，同步开放分所加盟",
            "deepseek_api_key": "$DEEPSEEK_API_KEY",
            "mao_quotes": [
              "实事求是",
              "没有调查，就没有发言权"
            ],
            "rss_sources": {
              "domestic": [
                {"name": "社会", "url": "https://www.chinanews.com.cn/rss/society.xml"},
                {"name": "财经", "url": "https://www.chinanews.com.cn/rss/finance.xml"},
                {"name": "法治", "url": "https://www.chinanews.com.cn/rss/fz.xml"},
                {"name": "生活", "url": "https://www.chinanews.com.cn/rss/life.xml"}
              ],
              "international": [
                {"name": "国际", "url": "https://www.chinanews.com.cn/rss/world.xml"}
              ]
            }
          }
          CONFEOF

      - name: 生成海报并推送飞书
        run: python generate_poster.py
