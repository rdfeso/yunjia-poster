<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日资讯</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; overflow-x: hidden; }
    body {
      color: #1f2a34;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f7f3ea;
    }
    .poster { display: flex; flex-direction: column; width: 1080px; margin: 0 auto; background: #f8f4eb; }
    .top-accent { height: 18px; background: #19528c; }
    .header { position: relative; height: 348px; padding: 54px 72px 0; color: #fff; background: #174b80 url("{{HEADER_URI}}") center / cover no-repeat; }
    .brand { display: flex; align-items: center; gap: 18px; height: 88px; }
    .logo { display: block; width: 82px; height: 82px; object-fit: contain; }
    .brand-name { color: #fff; font-size: 29px; font-weight: 700; letter-spacing: 3px; }
    .brand-subtitle { margin-top: 8px; color: rgba(255,255,255,.78); font-size: 15px; letter-spacing: 7px; }
    .title-row { margin-top: 34px; }
    h1 { margin: 0; font-family: "Songti SC", serif; font-size: 86px; font-weight: 700; letter-spacing: 14px; }
    .date-wrap { display: flex; align-items: center; gap: 16px; margin-top: 10px; text-align: left; }
    .date { font-size: 18px; letter-spacing: 2px; }
    .lunar { color: #f1d7b4; font-size: 16px; letter-spacing: 2px; }
    .issue { font-size: 12px; letter-spacing: 2px; opacity: .6; }
    .content { padding: 42px 60px 0; flex: 1; }
    .section-label { display: flex; align-items: center; gap: 14px; margin: 0 0 18px; color: #19528c; font-size: 22px; font-weight: 700; letter-spacing: 6px; }
    .section-label.international { margin-top: 30px; }
    .section-label::before { content: ""; width: 42px; height: 4px; background: #19528c; }
    .news-list { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex: 1; }
    .news-card { display: flex; min-height: 141px; padding: 18px 16px; border: 1px solid #e6ddcf; background: rgba(255,255,255,.72); }
    .news-index { flex: 0 0 54px; color: #b69266; font-family: Georgia, serif; font-size: 33px; font-weight: 700; line-height: 1; }
    .news-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 15px; }
    .category { padding: 3px 8px; color: #fff; background: #19528c; border-radius: 2px; font-size: 15px; }
    .source { color: #9a8f80; font-size: 15px; }
    h2 { margin: 0; color: #222; font-size: 21px; line-height: 1.4; }
    p { margin: 6px 0 0; color: #756d62; font-size: 16.5px; line-height: 1.55; }
    .footer { margin: 28px 60px 0; display: grid; grid-template-columns: 1fr 176px; gap: 28px; padding: 26px 28px; color: #fff; background: #174b80; }
    .recruit-title { color: #e9c891; font-size: 17px; font-weight: 700; letter-spacing: 3px; }
    .recruit-text { margin-top: 10px; font-size: 20px; font-weight: 600; line-height: 1.7; letter-spacing: 1px; }
    .quote { margin-top: 17px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.18); color: rgba(255,255,255,.78); font-size: 18px; line-height: 1.7; }
    .qr-box { text-align: center; }
    .qr { width: 152px; height: 152px; padding: 6px; background: #fff; }
    .qr-label { margin-top: 7px; color: #e9c891; font-size: 12px; letter-spacing: 1px; }
    .disclaimer { margin: 16px 60px 34px; color: #a39b90; font-size: 12px; line-height: 1.6; text-align: center; letter-spacing: 1px; }
  </style>
</head>
<body>
  <main class="poster">
    <div class="top-accent"></div>
    <header class="header">
      <div class="brand">
        <img class="logo" src="{{LOGO_URI}}" alt="Logo">
        <div>
          <div class="brand-name">{{BRAND_NAME}}</div>
          <div class="brand-subtitle">{{BRAND_SUBTITLE}}</div>
        </div>
      </div>
      <div class="title-row">
        <h1>每日资讯</h1>
        <div class="date-wrap">
          <div class="date">{{SOLAR_DATE}} {{WEEKDAY}}</div>
          <div class="lunar" id="lunar-date">农历日期</div>
          <div class="issue">ISSUE · {{ISSUE}}</div>
        </div>
      </div>
    </header>
    <section class="content">
      <div class="section-label">国内新闻 · 10 条</div>
      <div class="news-list">{{DOMESTIC_ARTICLES}}</div>
      <div class="section-label international">国际新闻 · 6 条</div>
      <div class="news-list">{{INTERNATIONAL_ARTICLES}}</div>
    </section>
    <section class="footer">
      <div>
        <div class="recruit-title">人才招募 · 合作共赢</div>
        <div class="recruit-text">{{RECRUITMENT}}</div>
        <div class="quote">{{QUOTE_SOURCE}}｜{{QUOTE}}</div>
      </div>
      <div class="qr-box">
        <img class="qr" src="{{QR_URI}}" alt="二维码">
        <div class="qr-label">{{CONTACT_LABEL}}</div>
      </div>
    </section>
    <div class="disclaimer">{{DISCLAIMER}}</div>
  </main>
  <script>
    const date = new Date("{{DATE_ISO}}T12:00:00");
    const lunar = new Intl.DateTimeFormat("zh-CN-u-ca-chinese", {
      month: "long", day: "numeric"
    }).format(date);
    document.getElementById("lunar-date").textContent = "农历 " + lunar;
  </script>
</body>
</html>
