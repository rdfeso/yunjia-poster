name: 每日资讯海报

on:
  schedule:
    # 北京时间每天早上6点 = UTC 22:00（前一天）
    - cron: "0 22 * * *"
  workflow_dispatch:  # 允许手动触发

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成配置文件
        run: |
          python -c "
          import json
          with open('config.example.json', encoding='utf-8') as f:
              cfg = json.load(f)
          cfg['deepseek_api_key'] = '${{ secrets.DEEPSEEK_API_KEY }}'
          cfg['feishu']['app_id'] = '${{ secrets.FEISHU_APP_ID }}'
          cfg['feishu']['app_secret'] = '${{ secrets.FEISHU_APP_SECRET }}'
          cfg['feishu']['chat_id'] = '${{ secrets.FEISHU_CHAT_ID }}'
          with open('config.json', 'w', encoding='utf-8') as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
          print('config.json 已生成')
          "

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        run: |
          python -m playwright install --with-deps chromium

      - name: 生成海报并推送飞书
        run: |
          BEIJING_DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          echo "海报日期: $BEIJING_DATE"
          python generate_poster.py --date $BEIJING_DATE
