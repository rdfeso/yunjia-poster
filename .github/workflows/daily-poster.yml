name: 云嘉每日资讯海报

on:
  schedule:
    # 北京时间每天早上 6:00 (UTC 22:00 前一天)
    - cron: "0 22 * * *"
  workflow_dispatch:  # 允许手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Playwright Chromium
        run: python -m playwright install chromium

      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 准备配置（从模板生成 config.json）
        run: cp config.example.json config.json

      - name: 步骤1 — RSS 抓取
        run: python generate_poster.py --fetch-only --output-dir output

      - name: 步骤2 — AI 摘要 + 海报生成 + 飞书推送
        run: |
          DATE_STR=$(date +%Y-%m-%d)
          python generate_poster.py --articles-json "output/raw-articles-${DATE_STR}.json" --output-dir output
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}

      - name: 上传海报（调试用，保留7天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-poster
          path: output/每日资讯-*.png
          retention-days: 7
