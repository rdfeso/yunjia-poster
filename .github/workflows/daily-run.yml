name: Daily Poster

on:
  schedule:
    - cron: "0 19 * * *"   # 北京 03:00
    - cron: "30 19 * * *"  # 北京 03:30
    - cron: "0 20 * * *"   # 北京 04:00
    - cron: "30 20 * * *"  # 北京 04:30
    - cron: "0 21 * * *"   # 北京 05:00
    - cron: "30 21 * * *"  # 北京 05:30
    - cron: "0 22 * * *"   # 北京 06:00
    - cron: "30 22 * * *"  # 北京 06:30
    - cron: "0 23 * * *"   # 北京 07:00
    - cron: "30 23 * * *"  # 北京 07:30
  workflow_dispatch:

concurrency:
  group: daily-poster-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check if should skip (dedup - any event)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"

          TODAY_SH=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "today=$TODAY_SH" >> "$GITHUB_OUTPUT"

          # 查今天所有 run（不限 status），排除 cancelled/failure
          # 只要有 in_progress 或 success 就跳过，防止并发竞争导致重复推送
          RESP=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${REPO}/actions/runs?per_page=30")

          RESULT=$(echo "$RESP" | python3 -c "
          import sys, json
          from datetime import datetime, timezone, timedelta
          data = json.load(sys.stdin)
          sh = timezone(timedelta(hours=8))
          today = datetime.now(sh).date()
          skip_statuses = {'success', 'in_progress', 'queued', 'waiting'}
          for r in data.get('workflow_runs', []):
              if r.get('name') != 'Daily Poster':
                  continue
              d = datetime.fromisoformat(r['created_at'].replace('Z','+00:00'))
              if d.astimezone(sh).date() != today:
                  continue
              status = r.get('status', '')
              conclusion = r.get('conclusion', '') or ''
              # 跳过已取消或失败的，继续检查其他
              if conclusion in ('cancelled', 'failure', 'skipped'):
                  continue
              if status in skip_statuses:
                  print('skip')
                  sys.exit()
          print('run')
          ")

          if [ "$RESULT" = "skip" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天已有运行中或成功的 run，跳过（防止并发重复推送）"
          else
            echo "今天尚无有效运行，继续执行"
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps + Playwright + fonts
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Prepare config
        if: steps.check.outputs.skip != 'true'
        run: cp config.example.json config.json

      - name: Step 1 - Fetch RSS
        if: steps.check.outputs.skip != 'true'
        run: |
          DATE_STR=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          python generate_poster.py --fetch-only --output-dir output --date "$DATE_STR"

      - name: Step 2 - AI summary + Generate + Push Feishu
        if: steps.check.outputs.skip != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: |
          DATE_STR=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          python generate_poster.py \
            --articles-json "output/raw-articles-${DATE_STR}.json" \
            --output-dir output \
            --date "$DATE_STR"

      - name: Upload poster artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-poster
          path: output/*.png
          retention-days: 7
