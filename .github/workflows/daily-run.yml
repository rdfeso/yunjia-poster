name: Daily Poster

on:
  schedule:
    - cron: "30 19 * * *"  # 北京 03:30（Pipedream 03:00 主触发后的第一道保底）
    - cron: "0 21 * * *"   # 北京 05:00（第二道保底）
    - cron: "0 23 * * *"   # 北京 07:00（最后兜底）
  workflow_dispatch:

concurrency:
  group: daily-poster-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check if should skip (dedup - any event)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"

          TODAY_SH=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          echo "today=$TODAY_SH" >> "$GITHUB_OUTPUT"

          # 查今天所有 run（不限 status），排除 cancelled/failure/skipped
          # 排除自身 run_id，避免把自己的 in_progress 误判为"已有运行"
          # 只要有其他 in_progress 或 success 就跳过，防止并发重复推送
          RESP=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${REPO}/actions/runs?per_page=30")

          RESULT=$(echo "$RESP" | python3 -c "
          import sys, json, os, urllib.request
          from datetime import datetime, timezone, timedelta
          data = json.load(sys.stdin)
          sh = timezone(timedelta(hours=8))
          today = datetime.now(sh).date()
          now_sh = datetime.now(sh)
          cutoff = now_sh - timedelta(hours=2)  # 缩减到2小时（防止昨天晚间 run 误杀今天凌晨触发）
          current_run_id = int(os.environ.get('CURRENT_RUN_ID', '0'))
          repo = os.environ.get('REPO', '')
          gh_token = os.environ.get('GH_TOKEN', '')

          def run_has_real_work(run_id):
              '''检查 run 是否真正执行了 Step 2（而非全部 skipped）'''
              try:
                  req = urllib.request.Request(
                      f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs',
                      headers={'Authorization': f'token {gh_token}', 'Accept': 'application/vnd.github.v3+json'}
                  )
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      jobs = json.loads(resp.read().decode())
                  for job in jobs.get('jobs', []):
                      for step in job.get('steps', []):
                          if 'Step 2' in step.get('name', '') and step.get('conclusion') == 'success':
                              return True
                  return False
              except Exception:
                  return True  # 查不到时保守处理，认为有实际工作

          for r in data.get('workflow_runs', []):
              if r.get('name') != 'Daily Poster':
                  continue
              if r.get('id') == current_run_id:
                  continue  # 跳过自身，避免自我误判
              d = datetime.fromisoformat(r['created_at'].replace('Z','+00:00'))
              d_sh = d.astimezone(sh)
              # 只看今天 或 过去2小时内（防止 UTC 跨天时相邻 run 被分到不同日期）
              if d_sh.date() != today and d_sh < cutoff:
                  continue
              status = r.get('status', '')
              conclusion = r.get('conclusion', '') or ''
              if conclusion in ('cancelled', 'failure', 'skipped'):
                  continue
              # 去重：有其他正在运行的就跳过（防止并发重复推送）
              if status in ('in_progress', 'queued', 'waiting'):
                  print('skip')
                  sys.exit()
              if conclusion == 'success':
                  # 关键修复：检查是否真正执行了 Step 2，跳过空 run
                  if run_has_real_work(r['id']):
                      print('skip')
                      sys.exit()
                  # 如果是全部 skipped 的空 run，不阻止当前 run
          print('run')
          ")

          if [ "$RESULT" = "skip" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天已有其他运行中或成功的 run，跳过（防止并发重复推送）"
          else
            echo "今天尚无有效运行，继续执行"
          fi

      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps + Playwright + fonts
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Prepare config
        if: steps.check.outputs.skip != 'true'
        run: cp config.example.json config.json

      - name: Step 1 - Fetch RSS
        if: steps.check.outputs.skip != 'true'
        run: |
          DATE_STR=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          python generate_poster.py --fetch-only --output-dir output --date "$DATE_STR"

      - name: Step 2 - AI summary + Generate + Push Feishu
        if: steps.check.outputs.skip != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: |
          DATE_STR=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          python generate_poster.py \
            --articles-json "output/raw-articles-${DATE_STR}.json" \
            --output-dir output \
            --date "$DATE_STR"

      - name: Upload poster artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-poster
          path: output/*.png
          retention-days: 7
