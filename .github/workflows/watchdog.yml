name: Watchdog - Daily Poster Fallback

on:
  schedule:
    # 5 分钟一次覆盖北京 03:00 ~ 08:00
    - cron: "*/5 19,20,21,22,23,0 * * *"
  workflow_dispatch:

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Beijing time window (only trigger between 03:00-08:00)
        id: window
        run: |
          HOUR_SH=$(TZ=Asia/Shanghai date +%H)
          echo "current Beijing hour: $HOUR_SH"
          if [ "$HOUR_SH" -ge 3 ] && [ "$HOUR_SH" -lt 8 ]; then
            echo "in_window=true" >> "$GITHUB_OUTPUT"
            echo "✅ 当前北京时间 ${HOUR_SH} 点，在触发窗口 03:00-08:00 内"
          else
            echo "in_window=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 当前北京时间 ${HOUR_SH} 点，不在窗口内，跳过"
          fi

      - name: Check if main workflow already ran or is running today
        id: check
        if: steps.window.outputs.in_window == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request
          from datetime import datetime, timezone, timedelta
          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          sh = timezone(timedelta(hours=8))
          today = datetime.now(sh).date()

          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}
          # Check all recent runs of Daily Poster (any status)
          url = f"https://api.github.com/repos/{repo}/actions/runs?per_page=30"
          req = urllib.request.Request(url, headers=headers)
          resp = urllib.request.urlopen(req, timeout=15)
          data = json.loads(resp.read())
          found = False
          found_status = ""
          for r in data.get("workflow_runs", []):
              if r.get("name") != "Daily Poster":
                  continue
              d = datetime.fromisoformat(r["created_at"].replace("Z","+00:00"))
              if d.astimezone(sh).date() == today:
                  found = True
                  found_status = r.get("status", "")
                  break

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              if found:
                  f.write("result=skip\n")
                  print(f"✅ 今天已有运行记录（状态: {found_status}），跳过")
              else:
                  f.write("result=trigger\n")
                  print("⚠️ 今天尚无任何运行记录，触发主 workflow")
          PYEOF

      - name: Trigger main workflow
        if: steps.window.outputs.in_window == 'true' && steps.check.outputs.result == 'trigger'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/293487209/dispatches" \
            -d '{"ref":"main"}'
          echo "🔔 已触发 Daily Poster workflow_dispatch"
